<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TitanDrive · Repositorio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600&display=swap" rel="stylesheet" />
    <style>
        /* ===== RESET Y VARIABLES ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-card: rgba(18, 18, 30, 0.75);
            --text-primary: #e8e8f0;
            --text-secondary: #a8b0c8;
            --cyan: #00f0ff;
            --magenta: #ff00c8;
            --blue: #4060ff;
            --glow-cyan: 0 0 30px rgba(0, 240, 255, 0.25);
            --glow-magenta: 0 0 30px rgba(255, 0, 200, 0.2);
            --font-display: 'Orbitron', monospace;
            --font-body: 'Inter', sans-serif;
            --transition-smooth: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            --transition-bounce: 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            --shadow-card: 0 20px 60px rgba(0, 0, 0, 0.7);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== FONDO ===== */
        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .grid-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: 1;
            pointer-events: none;
            mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
            -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 70%);
        }

        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 2;
        }

        /* ===== HEADER ===== */
        header {
            background: rgba(10, 10, 15, 0.75);
            backdrop-filter: blur(24px) saturate(1.6);
            border-bottom: 1px solid rgba(0, 240, 255, 0.08);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background var(--transition-smooth), box-shadow var(--transition-smooth);
        }

        header.scrolled {
            background: rgba(10, 10, 15, 0.92);
            box-shadow: 0 4px 40px rgba(0, 0, 0, 0.5);
            border-bottom-color: rgba(0, 240, 255, 0.15);
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-family: var(--font-display);
            font-size: 1.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(0, 240, 255, 0.15);
            transition: transform var(--transition-bounce);
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }
        .logo::before {
            content: '⟨';
            font-weight: 400;
            opacity: 0.6;
        }
        .logo::after {
            content: '⟩';
            font-weight: 400;
            opacity: 0.6;
        }
        .logo:hover {
            transform: scale(1.02) skewX(-2deg);
        }

        .nav-links {
            display: flex;
            gap: 2.5rem;
            list-style: none;
            flex-wrap: wrap;
        }

        .nav-links a {
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 0.3rem 0;
            position: relative;
            transition: color var(--transition-smooth);
        }

        .nav-links a::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--cyan), var(--magenta));
            transition: width var(--transition-smooth);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: var(--text-primary);
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        /* ===== SECCIÓN REPOSITORIO ===== */
        section {
            padding: 4rem 0;
            flex: 1;
            opacity: 0;
            transform: translateY(30px);
            animation: fadeSlideUp 0.8s ease forwards;
        }

        @keyframes fadeSlideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .section-title {
            font-family: var(--font-display);
            font-size: 3.4rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, var(--cyan), var(--blue), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-shadow: 0 0 60px rgba(0, 240, 255, 0.1);
        }

        .section-sub {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        /* ===== RECURSO DESTACADO (fuera de carpetas) ===== */
        .featured-resource {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 1.8rem 2rem;
            margin-bottom: 3rem;
            border: 1px solid rgba(255, 0, 200, 0.25);
            box-shadow: var(--glow-magenta), var(--shadow-card);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.5rem;
            transition: all var(--transition-smooth);
        }

        .featured-resource:hover {
            transform: translateY(-4px);
            box-shadow: var(--glow-cyan), var(--glow-magenta), var(--shadow-card);
        }

        .featured-resource .info {
            display: flex;
            align-items: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .featured-resource .info .icon {
            font-size: 2.8rem;
        }

        .featured-resource .info .text h3 {
            font-family: var(--font-display);
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--magenta);
            letter-spacing: 0.5px;
        }

        .featured-resource .info .text p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 300;
        }

        .featured-resource .btn-download-featured {
            display: inline-block;
            background: transparent;
            color: var(--magenta);
            border: 1px solid var(--magenta);
            padding: 0.6rem 2rem;
            border-radius: 60px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.7rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
            transition: all var(--transition-smooth);
            cursor: pointer;
            white-space: nowrap;
        }

        .featured-resource .btn-download-featured:hover {
            background: var(--magenta);
            color: var(--bg-primary);
            box-shadow: var(--glow-magenta);
            transform: scale(1.05);
        }

        /* ===== GRID DE CARPETAS ===== */
        .repo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 2rem;
            width: 100%;
        }

        .folder-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 2rem 1.2rem;
            border: 1px solid rgba(0, 240, 255, 0.08);
            box-shadow: var(--shadow-card);
            transition: all var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            user-select: none;
        }

        .folder-card::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 20px;
            padding: 2px;
            background: linear-gradient(135deg, var(--cyan), var(--magenta), var(--blue));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: 0;
            transition: opacity var(--transition-smooth);
        }

        .folder-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: transparent;
            box-shadow: var(--glow-cyan), var(--shadow-card);
        }

        .folder-card:hover::before {
            opacity: 0.5;
        }

        .folder-card .icon {
            font-size: 3rem;
            margin-bottom: 0.8rem;
            filter: drop-shadow(0 0 15px rgba(0, 240, 255, 0.15));
            transition: transform var(--transition-bounce);
        }

        .folder-card:hover .icon {
            transform: scale(1.1) rotate(-3deg);
        }

        .folder-card h3 {
            font-family: var(--font-display);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: var(--cyan);
            margin-bottom: 0.3rem;
        }

        .folder-card .badge {
            font-size: 0.65rem;
            color: var(--text-secondary);
            background: rgba(0, 240, 255, 0.08);
            padding: 0.2rem 0.8rem;
            border-radius: 40px;
            border: 1px solid rgba(0, 240, 255, 0.1);
            margin-top: 0.3rem;
            font-family: var(--font-display);
            letter-spacing: 0.5px;
        }

        /* ===== MODAL ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: var(--bg-card);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 30px;
            padding: 2.5rem 2rem;
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-shadow: var(--glow-cyan), var(--shadow-card);
            position: relative;
            animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 80vh;
            overflow-y: auto;
        }

        @keyframes modalPop {
            0% {
                transform: scale(0.8) translateY(20px);
                opacity: 0;
            }
            100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal-box .modal-icon {
            font-size: 3.5rem;
            margin-bottom: 0.5rem;
        }

        .modal-box h2 {
            font-family: var(--font-display);
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--cyan);
            margin-bottom: 1rem;
        }

        .modal-box .modal-items {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.8rem;
            text-align: left;
        }

        .modal-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0, 240, 255, 0.04);
            padding: 0.6rem 1rem;
            border-radius: 12px;
            border: 1px solid rgba(0, 240, 255, 0.06);
            transition: background var(--transition-smooth);
            gap: 1rem;
            flex-wrap: wrap;
        }

        .modal-item:hover {
            background: rgba(0, 240, 255, 0.08);
        }

        .modal-item .item-name {
            font-size: 0.9rem;
            color: var(--text-primary);
            font-weight: 400;
            flex: 1;
            min-width: 120px;
        }

        .modal-item .btn-download-modal {
            display: inline-block;
            background: transparent;
            color: var(--cyan);
            border: 1px solid var(--cyan);
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.6rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
            transition: all var(--transition-smooth);
            cursor: pointer;
            white-space: nowrap;
        }

        .modal-item .btn-download-modal:hover {
            background: var(--cyan);
            color: var(--bg-primary);
            box-shadow: var(--glow-cyan);
            transform: scale(1.04);
        }

        .modal-box .modal-empty {
            color: var(--text-secondary);
            font-size: 1rem;
            margin-bottom: 1.8rem;
        }

        .modal-close {
            background: transparent;
            border: 1px solid var(--magenta);
            color: var(--magenta);
            padding: 0.6rem 2rem;
            border-radius: 60px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all var(--transition-smooth);
        }

        .modal-close:hover {
            background: var(--magenta);
            color: var(--bg-primary);
            box-shadow: var(--glow-magenta);
            transform: scale(1.05);
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: auto;
            text-align: center;
            padding: 2.5rem 0;
            border-top: 1px solid rgba(0, 240, 255, 0.05);
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            position: relative;
            z-index: 2;
            font-family: var(--font-body);
        }

        footer span {
            background: linear-gradient(135deg, var(--cyan), var(--magenta));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 600;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                padding: 0 1.5rem;
            }

            .nav-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 0.5rem;
            }

            .logo {
                text-align: center;
                font-size: 1.5rem;
                justify-content: center;
            }

            .nav-links {
                justify-content: center;
                gap: 1.2rem;
            }

            .nav-links a {
                font-size: 0.65rem;
                letter-spacing: 1px;
            }

            .section-title {
                font-size: 2.6rem;
            }

            .section-sub {
                font-size: 1rem;
            }

            .featured-resource {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
                padding: 1.5rem;
            }

            .featured-resource .info {
                justify-content: center;
            }

            .repo-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 1.5rem;
            }

            .folder-card .icon {
                font-size: 2.4rem;
            }
            .folder-card h3 {
                font-size: 0.85rem;
            }

            .modal-box {
                padding: 2rem 1.2rem;
                max-width: 95%;
            }

            .modal-item {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }

            .modal-item .btn-download-modal {
                align-self: center;
            }
        }

        @media (max-width: 480px) {
            .nav-links {
                gap: 0.8rem;
            }
            .section-title {
                font-size: 2rem;
            }
            .repo-grid {
                grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
            }
            .folder-card {
                padding: 1.2rem 0.8rem;
            }
            .folder-card .icon {
                font-size: 2rem;
            }
        }
    </style>
</head>

        // ===== GENERAR GRID =====
        const grid = document.getElementById('folderGrid');
        folders.forEach(folder => {
            const card = document.createElement('div');
            card.className = 'folder-card';
            const hasItems = folder.items && folder.items.length > 0;
            card.innerHTML = `
                <div class="icon">${folder.icon}</div>
                <h3>${folder.name}</h3>
                <div class="badge">${hasItems ? 'Disponible' : 'Próximamente'}</div>
            `;
            card.addEventListener('click', () => openModal(folder));
            grid.appendChild(card);
        });

        // ===== MODAL =====
        const overlay = document.getElementById('modalOverlay');
        const modalIcon = document.getElementById('modalIcon');
        const modalTitle = document.getElementById('modalTitle');
        const modalContent = document.getElementById('modalContent');
        const closeBtn = document.getElementById('modalCloseBtn');

        function openModal(folder) {
            modalIcon.textContent = folder.icon;
            modalTitle.textContent = folder.name;

            if (folder.items && folder.items.length > 0) {
                let html = '<div class="modal-items">';
                folder.items.forEach(item => {
                    html += `
                        <div class="modal-item">
                            <span class="item-name">${item.name}</span>
                            <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-download-modal">Descargar</a>
                        </div>
                    `;
                });
                html += '</div>';
                modalContent.innerHTML = html;
            } else {
                modalContent.innerHTML = `<p class="modal-empty">Recursos disponibles próximamente.</p>`;
            }

            overlay.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            overlay.classList.remove('active');
            document.body.style.overflow = '';
        }

        closeBtn.addEventListener('click', closeModal);
        overlay.addEventListener('click', (e) => {
            if (e.target === overlay) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // ===== PARTÍCULAS CONECTADAS =====
        (function() {
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');
            let width, height;
            let particles = [];
            const NUM = 100;
            const CONNECTION_DIST = 150;
            const SPEED = 0.3;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }
            window.addEventListener('resize', resize);
            resize();

            for (let i = 0; i < NUM; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    vx: (Math.random() - 0.5) * SPEED * 2,
                    vy: (Math.random() - 0.5) * SPEED * 2,
                    r: Math.random() * 2 + 1,
                    alpha: Math.random() * 0.6 + 0.2,
                });
            }

            function draw() {
                ctx.clearRect(0, 0, width, height);

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    if (p.x < 0 || p.x > width) p.vx *= -1;
                    if (p.y < 0 || p.y > height) p.vy *= -1;
                });

                for (let i = 0; i < particles.length; i++) {
                    for (let j = i + 1; j < particles.length; j++) {
                        const dx = particles[i].x - particles[j].x;
                        const dy = particles[i].y - particles[j].y;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist < CONNECTION_DIST) {
                            const alpha = 0.15 * (1 - dist / CONNECTION_DIST);
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 240, 255, ${alpha})`;
                            ctx.lineWidth = 0.6;
                            ctx.stroke();
                        }
                    }
                }

                particles.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(0, 240, 255, ${p.alpha * 0.6})`;
                    ctx.fill();
                    ctx.shadowColor = 'rgba(0, 240, 255, 0.2)';
                    ctx.shadowBlur = 8;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });

                requestAnimationFrame(draw);
            }
            draw();
        })();

        // ===== HEADER SCROLL =====
        const header = document.getElementById('header');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 30) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });
